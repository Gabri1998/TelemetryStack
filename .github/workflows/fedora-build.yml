name: Fedora Native Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  fedora-build:
    runs-on: ubuntu-latest
    container:
      image: fedora:rawhide  # Bleeding edge Fedora
    
    steps:
    - name: Install dependencies
      run: |
        dnf update -y
        dnf install -y dotnet-sdk-10.0 nodejs npm
    
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      run: |
        dotnet --info
        dotnet restore TelemetryStack-C#.NET.sln
    
    - name: Build .NET projects
      run: |
        dotnet build TelemetryStack-C#.NET.sln --configuration Release
    
    - name: Setup Node.js for frontend
      run: |
        cd frontend/web-dashboard
        npm ci
        npm run build