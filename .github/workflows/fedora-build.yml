name: Fedora Native Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  fedora-build:
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    
    steps:
    - name: Install dependencies
      run: |
        dnf update -y
        # Change from dotnet-sdk-10.0 to dotnet-sdk-9.0
        dnf install -y dotnet-sdk-9.0 nodejs npm podman podman-compose
    
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      run: |
        dotnet --info
        dotnet restore TelemetryStack-C#.NET.sln
    
    - name: Build .NET projects
      run: |
        dotnet build TelemetryStack-C#.NET.sln --configuration Release
    
    - name: Setup Node.js for frontend
      run: |
        cd frontend/web-dashboard
        npm ci
        npm run build
    
    - name: Build Podman containers
      run: |
        podman-compose build
    
    - name: Run container tests
      run: |
        podman-compose up -d
        sleep 15
        podman-compose ps
        podman-compose down