name: Docker Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=sha,prefix=,format=short
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
    
    - name: Build API Gateway
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./apps/api-gateway/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}-api-gateway
        labels: ${{ steps.meta.outputs.labels }}
    
    - name: Build Auth Service
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./apps/auth-service/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}-auth-service
        labels: ${{ steps.meta.outputs.labels }}
    
    - name: Build Device Service
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./apps/device-service/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}-device-service
        labels: ${{ steps.meta.outputs.labels }}
    
    - name: Build Telemetry Service
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./apps/telemetry-service/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}-telemetry-service
        labels: ${{ steps.meta.outputs.labels }}